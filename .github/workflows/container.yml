name: Container

on:
  push:
    branches:
      - v0.1
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: container-v0.1
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    if: github.repository == 'ScottJWalter/wildsource'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork branch
        uses: actions/checkout@v4
        with:
          ref: v0.1
          fetch-depth: 0

      - name: Configure sync identity
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync from upstream
        if: github.event_name == 'schedule'
        run: |
          git remote add upstream https://github.com/jasanpreetn9/wildsource.git
          git fetch upstream v0.1

          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            exit 0
          fi

          git merge --no-edit FETCH_HEAD
          git push origin HEAD:refs/heads/v0.1

      - name: Identify image commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/scottjwalter/wildsource:latest
            ghcr.io/scottjwalter/wildsource:sha-${{ steps.commit.outputs.sha }}
          build-args: |
            PUBLIC_REPO_URL=${{ vars.PUBLIC_REPO_URL || 'https://github.com/ScottJWalter/wildsource' }}
            PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL || 'https://wildsource.jnagra.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
